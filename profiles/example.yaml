# Example benchmark profile — machine-local paths and runtime configuration.
#
# Copy this file and replace every /path/to/... placeholder with the
# corresponding absolute path on your machine, then point the CLI at it via
# `datacuration-bench run --profile example` (or whatever filename you keep).

# Dataset paths keyed by dataset_id (must match task YAML dataset.dataset_id)
dataset_path_map:
  llava665k: /path/to/datasets/llava665k_full
  visionflan: /path/to/datasets/vision-flan


# Model paths keyed by model_key (must match task YAML model_key)
model_path_map:
  llava-1.5-7b-hf: /path/to/data-curation/models/llava15-7b-hf-init
  qwen2.5-vl-3b-instruct: /path/to/data-curation/models/Qwen2.5-VL-3B-Instruct
  qwen2-vl-2b: /path/to/data-curation/models/Qwen2-VL-2B
  smolvlm-256m: /path/to/data-curation/models/SmolVLM-256M-Base
  smolvlm-500m: /path/to/data-curation/models/SmolVLM-500M-Base
  smolvlm: /path/to/data-curation/models/SmolVLM-Base

# Evaluation data directory
eval_data_dir: /path/to/LMUData

# Environment variables passed to training/eval subprocesses
env:
  CUDA_VISIBLE_DEVICES: "4"
  BENCHMARK_TRAIN_GPUS: "4"
  BENCHMARK_EVAL_GPUS: "4"
  VLLM_GPU_MEMORY_UTILIZATION: "0.9"
  # Local vLLM judge: when OPENAI_API_BASE points at a local server, the key
  # only needs to be non-empty (vLLM accepts any token once --api-key is set).
  # Replace with your real key if you route the judge through a paid endpoint.
  OPENAI_API_KEY: "REPLACE_WITH_LOCAL_LLM_API_KEY"
  OPENAI_API_BASE: "http://localhost:8001/v1/chat/completions"
  LOCAL_LLM: "Qwen3.5-27B"
