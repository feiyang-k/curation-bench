[project]
name = "vlmeval"
version = "0.1.0"
description = "OpenCompass VLM Evaluation Kit"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate",
    "anls>=0.0.2",
    "antlr4-python3-runtime==4.11.1",
    "apted>=1.0.3",
    "bert_score",
    "cairosvg",
    "colormath>=3.0.0",
    "datasets",
    "eva-decord>=0.6.0",
    "distance>=0.1.3",
    "editdistance>=0.8.1",
    "einops",
    "google-genai",
    "gradio",
    "huggingface_hub",
    "imageio",
    "jieba>=0.42.1",
    "json_repair",
    "levenshtein>=0.27.1",
    "lpips",
    "lxml>=6.0.2",
    "math-verify",
    "matplotlib",
    "nltk",
    "numpy",
    "omegaconf>=2.4.0.dev4",
    "openai",
    "openai-clip",
    "opencv-python>=4.7.0.72",
    "openpyxl",
    "pandas",
    "pdf2image>=1.17.0",
    "pillow",
    "polygon3>=3.0.9.1",
    "portalocker",
    "protobuf",
    "pylatexenc==2.10",
    "python-dotenv",
    "qwen_vl_utils",
    "requests",
    "rich",
    "scikit-image",
    "scikit-learn",
    "sentence_transformers",
    "sentencepiece",
    "sty",
    "sympy",
    "tabulate",
    "tiktoken",
    "timeout-decorator",
    "timm",
    "torch",
    "torchmetrics",
    "torchvision",
    "tqdm",
    "transformers>=4.45,<5",
    "typing_extensions",
    "validators",
    "xlsxwriter",
    "zss>=1.2.0",
    "rouge>=1.0.1",
    "ipdb>=0.13.13",
    "setuptools<81",
    "vllm>=0.17",
]

[project.scripts]
vlmutil = "vlmeval:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vlmeval"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
